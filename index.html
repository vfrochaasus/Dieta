<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3ee;--surface:#fff;--ink:#12231a;--mute:#5b6b61;--line:#d3ddd5;--accent:#0f7b5f;--accent-ink:#fff;--rec:#d6342c;--prot:#7a4fd0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a14;--surface:#172620;--ink:#e6f0e9;--mute:#93a69a;--line:#2a3d33;--accent:#3cc79d;--accent-ink:#06150e;--rec:#ff6a60;--prot:#b49bff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a14;--surface:#172620;--ink:#e6f0e9;--mute:#93a69a;--line:#2a3d33;--accent:#3cc79d;--accent-ink:#06150e;--rec:#ff6a60;--prot:#b49bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 12px;letter-spacing:-.01em}
.day{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.day button{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:1.2rem}
.day strong{font-size:1.05rem;text-align:center;flex:1}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.sum .r{display:flex;align-items:baseline;gap:8px;margin:4px 0}
.sum .r b{font-size:1.4rem}
.sum .r small{color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.bar.p i{background:var(--prot)}
.rem{font-size:.9rem;color:var(--mute);margin:-2px 0 8px}
.rem b{color:var(--ink)}
.goal{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--mute);font-size:.85rem}
.goal input{width:62px;padding:4px 6px;font-size:.9rem}
.mic{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 12px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
#micBtn{width:88px;height:88px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:2.2rem;cursor:pointer}
#micBtn.on{background:var(--rec);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--rec) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){#micBtn.on{animation:none}}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#status{color:var(--mute);min-height:1.4em;text-align:center;font-size:.95rem}
.row{display:flex;gap:8px;width:100%;align-items:center}
.row label{color:var(--mute);font-size:.9rem;white-space:nowrap}
textarea,select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
select{flex:1}
textarea{flex:1;resize:none;height:48px}
.add{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:0 16px;height:48px;font:inherit;font-weight:700}

.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:8px 10px}
.block.drag{box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:.92;position:relative;z-index:5}
.bh{display:flex;align-items:center;gap:8px;min-height:44px}
.handle{touch-action:none;cursor:grab;font-size:1.4rem;color:var(--mute);width:36px;height:44px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}

.bt .k{color:var(--accent);font-weight:700}
.bt .p{color:var(--prot);font-weight:700}
.item{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 2px}
.item .t{flex:1;cursor:pointer}
.item .t small{display:block;color:var(--mute)}
.item .x{background:none;border:0;color:var(--mute);font-size:1.3rem;width:36px;height:36px}
.ed{display:flex;gap:6px;align-items:center;padding:6px 0 10px;flex-wrap:wrap}
.ed input{width:84px;padding:6px 8px}

.none{color:var(--mute);font-size:.9rem;padding:2px 4px 8px 44px}
.tools{margin-top:8px}

.note{color:var(--mute);font-size:.8rem;margin:10px 2px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.objs{display:flex;gap:6px;margin:0 0 12px}
.tabs button,.objs button{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:inherit}
.tabs button.on,.objs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.wr{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:10px 12px;margin-bottom:6px}
.wr small{display:block;color:var(--mute)}
.wr span{font-weight:700;text-align:right}
.wr.ok{border-left-color:var(--accent)}.wr.ok span{color:var(--accent)}
.wr.bad{border-left-color:var(--rec)}.wr.bad span{color:var(--rec)}
.wr.na span{color:var(--mute);font-weight:400}
.big{font-size:1.5rem;font-weight:700}
.big.ok{color:var(--accent)}.big.bad{color:var(--rec)}
.sum .l{color:var(--mute);font-size:.9rem;margin-top:6px}
.objs button{color:var(--c)}
.mh{display:flex;align-items:center;justify-content:space-between;width:100%}
.mh span{font-weight:700}
#plusBtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.6rem;line-height:1;cursor:pointer}
#foodForm{width:100%;display:flex;flex-direction:column;gap:8px}
#foodForm[hidden]{display:none}
#foodForm input{width:100%}
#foodForm .fr{display:flex;gap:8px}
#fSave{background:var(--ink);color:var(--bg);border:0;border-radius:10px;height:44px;font:inherit;font-weight:700}
#fMsg{color:var(--mute);font-size:.9rem;min-height:1.2em}
.cf{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;color:var(--mute);border-top:1px solid var(--line);padding:4px 0}
.cf button{background:none;border:0;color:var(--mute);font-size:1.2rem;width:36px;height:36px}
.mh span{flex:1;text-align:center}
#editBtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.15rem;cursor:pointer}
#editPanel{width:100%;max-height:50vh;overflow:auto}
#editPanel[hidden]{display:none}
.er{display:grid;grid-template-columns:1fr 64px 64px 54px;gap:6px;align-items:center;padding:4px 0;border-top:1px solid var(--line);font-size:.9rem}
.er.hd{font-size:.75rem;color:var(--mute);border-top:0;position:sticky;top:0;background:var(--surface)}
.er input{width:100%;padding:6px 4px;font-size:.9rem}
#fDown{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;height:44px;font:inherit}
#fOut{width:100%;height:96px;font-size:.8rem}
#bk{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
#ghSave{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;min-height:44px;font:inherit}
#ghMsg{color:var(--mute);font-size:.9rem;min-height:1.2em}
#bd{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
#foodForm:not([hidden]),#editPanel:not([hidden]){position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 80px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:auto}
#editPanel:not([hidden]){display:flex;flex-direction:column;padding:0;overflow:hidden}
#editBody{flex:1;min-height:0;overflow:auto;padding:0 16px}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem}
#editPanel .dh{padding:12px 16px}
.dh button{background:none;border:0;color:var(--mute);font-size:1.5rem;width:40px;height:40px}
.df{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.df button{flex:1;height:44px;border-radius:10px;font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.df #eSave{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.objs button.on{background:color-mix(in srgb,var(--c) 16%,var(--surface));border-color:var(--c);color:var(--c);font-weight:700}
.objs button[data-o="perder"]{--c:#c62828}
.objs button[data-o="manter"]{--c:#1f5fd1}
.objs button[data-o="ganhar"]{--c:#0f7b3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .objs button[data-o="perder"]{--c:#ff6a60}:root:not([data-theme="light"]) .objs button[data-o="manter"]{--c:#6ea2ff}:root:not([data-theme="light"]) .objs button[data-o="ganhar"]{--c:#3cc79d}}
:root[data-theme="dark"] .objs button[data-o="perder"]{--c:#ff6a60}
:root[data-theme="dark"] .objs button[data-o="manter"]{--c:#6ea2ff}
:root[data-theme="dark"] .objs button[data-o="ganhar"]{--c:#3cc79d}
</style>
</head>

<div id="blocks"></div>
<div class="tools" hidden><button id="copy">Copiar resumo do dia</button></div>

function parse(t){
  var parts=t.split(/,(?!\d)|;|\s+e\s+|\s+mais\s+|\s+(?=\d|(?:dois|duas|tr[eê]s|quatro|cinco|seis|sete|oito|nove|dez|cem|duzentos|duzentas|trezentos|trezentas|quatrocentos|quinhentos)\b)/i).map(function(s){return s.trim()}).filter(Boolean);

  });
  list.sort(function(a,b){return a.nm.localeCompare(b.nm,"pt-BR")}).forEach(function(e){row(e.nm,e.k,e.p,e.u,e.cb)});

var REPO="vfrochaasus/Dieta",BKP="backup/dados.json";
function b64(s){var by=new TextEncoder().encode(s),r="";by.forEach(function(c){r+=String.fromCharCode(c)});return btoa(r)}
function bkPayload(){return JSON.stringify({app:"diario-alimentar",tipo:"backup-completo",data:new Date().toISOString(),diario:data,metas:goals,objetivo:obj,ordem_refeicoes:order,alimentos:custom,ajustes_tabela:adj},null,1)}
async function ghBackup(manual){
  var m=document.getElementById("ghMsg"),tok=null;
  try{tok=localStorage.getItem("gh_token")}catch(e){}
  if(!tok){if(manual)m.textContent="Cole o token primeiro.";return}
  if(!manual&&!Object.keys(data).length&&!custom.length)return;
  try{
    var H={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"},u="https://api.github.com/repos/"+REPO+"/contents/"+BKP,sha;
    var g=await fetch(u,{headers:H});
    if(g.status===200)sha=(await g.json()).sha;else if(g.status!==404)throw{s:g.status};
    var body={message:"Backup automatico "+key(new Date()),content:b64(bkPayload()),branch:"main"};if(sha)body.sha=sha;
    var p=await fetch(u,{method:"PUT",headers:H,body:JSON.stringify(body)});
    if(!p.ok)throw{s:p.status};
    sv("gh_ultimo",key(new Date()));m.textContent="Backup feito em "+new Date().toLocaleString("pt-BR");
  }catch(e){m.textContent=(e&&(e.s===401||e.s===403))?"Token inv\u00e1lido ou expirado. Crie um novo e cole aqui.":"N\u00e3o foi poss\u00edvel fazer o backup agora. Tento de novo quando voc\u00ea abrir o app com internet."}
}

};
